<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Costing Option Review</title>
<!-- costing-kit 화면 엔진 v2. 작업 폴더에는 복사하지 않는다 — single_file.py가 이 파일 + board/data.js + board/media로 단일 HTML을 만든다. -->
<link rel="stylesheet" href="engine.css">
</head><body>
<div id="fit"><div class="app">
 <div id="wash"></div>
 <div class="top">
  <div class="tl"><span id="brand"></span><div class="sub" id="sub"></div></div>
  <div class="rt" id="rt"></div>
 </div>

 <div class="stage">
  <div id="stagebg"></div>
  <div class="panes">
   <div class="pane" id="orig"></div>
   <div class="pane" id="frame"></div>
  </div>
  <div class="cmpband">
   <div class="cell" id="cellA">
    <div class="row"><div class="txt"><span class="tag">ORIGINAL</span><span class="nm" id="nmA"></span></div>
     <span class="price" id="prA"></span></div>
   </div>
   <span class="arrow" aria-hidden="true">&rarr;</span>
   <div class="cell" id="cellB">
    <div class="row"><div class="txt"><span class="tag">COST OPTION</span><span class="nm" id="nmB"></span></div>
     <span class="saver" id="saver" hidden><span class="t" id="saverT">SAVING</span><span class="total zero" id="total">—</span>
      <span class="price" id="prB"></span></span></div>
    <span class="bar"><i id="bar"></i></span>
    <span class="fly" id="fly"></span>
   </div>
  </div>
  <div class="fx" id="fx"></div>
 </div>

 <div class="bot">
  <div class="grid" id="grid"></div>
  <div class="crow">
   <span class="lbl">COLOR</span>
   <span class="chips" id="chips"></span>
   <span class="cname" id="cname">—</span>
  </div>
  <div class="ov">
   <div class="hdr">
    <span class="lbl">COST OPTION</span>
    <span class="hint" id="hint"></span>
    <span class="side" id="sideWrap">
     <button type="button" id="sF" aria-pressed="true">Front</button>
     <button type="button" id="sB" aria-pressed="false">Back</button>
    </span>
   </div>
   <div class="opts" id="optsRow"></div>
  </div>
  <div class="ggmark" id="credit"></div>
 </div>
</div></div>
<script src="data.js"></script>
<script src="engine.js"></script>
</body></html>
